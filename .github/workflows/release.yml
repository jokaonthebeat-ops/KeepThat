# ==============================================================================
#  Windows build + GitHub Release.
#
#  This exists because the Windows binaries CANNOT be produced on the Mac this
#  project is developed on - there is no MinGW, no clang-cl and no Wine there.
#  GitHub's windows-latest runner has MSVC, so the Windows VST3 and standalone
#  are built here and attached to the release.
#
#  The macOS .pkg is built and signed locally (make universal && make installer
#  && make notarize) because it needs the Developer ID certificates, which do
#  not belong in CI secrets. Upload it to the same release by hand, or with:
#      gh release upload v0.9.0 build/dist/KeepThat-0.9.0.pkg
#
#  Trigger: push a tag like v0.9.0, or run it by hand from the Actions tab.
# ==============================================================================
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# One run per ref. A re-push should cancel the run it supersedes rather than
# paying for both - this repository is on metered minutes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    name: Windows (VST3 + Standalone)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Windows runners bill at a 2x minute multiplier, and the biggest
      # avoidable cost in this job is re-cloning and re-building JUCE on every
      # run. FetchContent puts it in build/_deps; caching that keyed on the
      # CMakeLists (which pins the JUCE tag) turns a fresh clone + full
      # framework build into a restore.
      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: juce-${{ runner.os }}-

      # JUCE has deeply nested module paths, and FetchContent puts them under
      # D:\a\KeepThat\KeepThat\build\_deps\juce-src\... which runs into
      # Windows' 260-character MAX_PATH. That is the classic way a JUCE build
      # fails on a Windows runner and nowhere else - this configure succeeds on
      # macOS with the same CMakeLists.
      - name: Allow long paths
        run: |
          git config --system core.longpaths true
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f

      # What is actually on this image? Printed to the summary because the
      # job log needs admin rights to download, and a Configure failure this
      # fast is almost always the toolchain, not the CMakeLists.
      - name: Toolchain
        shell: pwsh
        run: |
          "## Toolchain" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          cmake --version | Out-File -Append $env:GITHUB_STEP_SUMMARY
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -products * -property displayName | Out-File -Append $env:GITHUB_STEP_SUMMARY
            & $vswhere -products * -property installationVersion | Out-File -Append $env:GITHUB_STEP_SUMMARY
          } else { "vswhere not found" | Out-File -Append $env:GITHUB_STEP_SUMMARY }
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY

      # The generator is deliberately NOT pinned. `windows-latest` moves to a
      # new image (and a new Visual Studio) periodically, and pinning
      # "Visual Studio 17 2022" makes configure fail in seconds with "could not
      # find any instance of Visual Studio" the moment that happens. CMake's
      # default on Windows is the newest installed VS, which is what we want.
      - name: Configure
        run: cmake -B build -A x64

      # If configure fails, the reason is in CMake's own logs and the job log
      # needs admin to download - so surface it in the run summary instead.
      - name: Show CMake errors
        if: failure()
        shell: pwsh
        run: |
          foreach ($f in @("build/CMakeFiles/CMakeError.log","build/CMakeFiles/CMakeOutput.log","build/CMakeFiles/CMakeConfigureLog.yaml")) {
            if (Test-Path $f) {
              "## $f" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
              Get-Content $f -Tail 120 | Out-File -Append $env:GITHUB_STEP_SUMMARY
              '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
            }
          }

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # JUCE puts artefacts under build/KeepThat_artefacts/Release/<FORMAT>/.
      # The product name has a space and an exclamation mark in it, so every
      # path here is quoted.
      - name: Package
        shell: pwsh
        run: |
          $stage = "stage/KEEP THAT!"
          New-Item -ItemType Directory -Force -Path "$stage/VST3" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/Standalone" | Out-Null

          $art = "build/KeepThat_artefacts/Release"
          Copy-Item -Recurse -Force "$art/VST3/KEEP THAT!.vst3" "$stage/VST3/"
          Copy-Item -Recurse -Force "$art/Standalone/*"          "$stage/Standalone/"

          @"
          KEEP THAT! - Windows

          VST3
            Copy "KEEP THAT!.vst3" into:
              C:\Program Files\Common Files\VST3\

          Standalone
            Keep the Resources folder NEXT TO the .exe - the artwork lives
            there. Move the whole Standalone folder wherever you like.

          Rescan plug-ins in your DAW after installing.
          "@ | Out-File -Encoding utf8 "$stage/Read Me.txt"

          Compress-Archive -Path "$stage/*" -DestinationPath "KeepThat-Windows.zip" -Force

      # Only on failure - on a good run this is just minutes spent printing.
      - name: Show what was built
        if: failure()
        shell: pwsh
        run: Get-ChildItem -Recurse build/KeepThat_artefacts | Select-Object FullName

      - uses: actions/upload-artifact@v4
        with:
          name: KeepThat-Windows
          path: KeepThat-Windows.zip
          if-no-files-found: error

  release:
    name: Attach to release
    needs: windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KeepThat-Windows

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: KeepThat-Windows.zip
          draft: true          # deliberately a DRAFT - check the build before it goes out
          generate_release_notes: true
